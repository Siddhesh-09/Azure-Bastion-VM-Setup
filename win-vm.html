<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windows Server | IIS Cloud Instance</title>
    <link href="https://fonts.googleapis.com/css2?family=Segoe+UI:wght@300;400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --azure-blue: #0078d4; --glass: rgba(255, 255, 255, 0.1); }
        
        body, html { 
            margin: 0; padding: 0; height: 100%; width: 100%; 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #001220;
            overflow: hidden; color: white;
        }

        /* The Glow Effect Background */
        .glow-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(0, 120, 212, 0.4) 0%, transparent 50%);
            z-index: 1; pointer-events: none;
        }

        .container {
            position: relative; z-index: 10;
            height: 100vh; display: flex; align-items: center; justify-content: center;
        }

        .mica-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(40px) saturate(150%);
            -webkit-backdrop-filter: blur(40px) saturate(150%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 4rem; text-align: center;
            width: 80%; max-width: 800px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .win-logo { width: 60px; margin-bottom: 20px; filter: drop-shadow(0 0 10px rgba(0,120,212,0.5)); }

        h1 { font-size: 3.5rem; font-weight: 700; margin: 0; letter-spacing: -1px; }
        
        .status-strip {
            display: inline-flex; align-items: center;
            background: rgba(0, 255, 136, 0.1);
            color: #00ff88; padding: 8px 20px;
            border-radius: 50px; font-weight: 600;
            font-size: 0.9rem; margin-bottom: 25px;
            border: 1px solid rgba(0, 255, 136, 0.3);
        }

        .stats-grid {
            display: grid; grid-template-columns: repeat(3, 1fr);
            gap: 20px; margin-top: 40px;
        }

        .stat-item {
            padding: 15px; border-radius: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .stat-label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.6; display: block; }
        .stat-value { font-size: 1.1rem; font-weight: 600; color: var(--azure-blue); }

        .btn-bastion {
            margin-top: 40px; background: var(--azure-blue);
            color: white; border: none; padding: 12px 40px;
            border-radius: 8px; font-weight: 600; cursor: pointer;
            transition: 0.3s;
        }
        .btn-bastion:hover { background: #005a9e; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,120,212,0.4); }
    </style>
</head>
<body>
    <div class="glow-bg" id="glow"></div>

    <div class="container">
        <div class="mica-card">
            <img src="https://upload.wikimedia.org/wikipedia/commons/4/44/Microsoft_logo.svg" class="win-logo" alt="Windows" style="filter: brightness(0) invert(1);">
            <br>
            <div class="status-strip">
                <span style="margin-right: 10px;">●</span> IIS 10.0 SERVICE ACTIVE
            </div>
            <h1>Windows Server 2025</h1>
            <p style="opacity: 0.7; font-size: 1.2rem; margin-top: 10px;">Cloud Instance Provisioned via Azure Bastion</p>
            
            <div class="stats-grid">
                <div class="stat-item">
                    <span class="stat-label">Platform</span>
                    <span class="stat-value">Azure VM</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Access Method</span>
                    <span class="stat-value">Bastion RDP</span>
                </div>
                <div class="stat-item">
                    <span class="stat-label">Web Server</span>
                    <span class="stat-value">IIS 10.0</span>
                </div>
            </div>

            <button class="btn-bastion" onclick="window.location.reload()">REFRESH HEALTH STATUS</button>
        </div>
    </div>

    <script>
        const glow = document.getElementById('glow');
        window.addEventListener('mousemove', (e) => {
            const x = (e.clientX / window.innerWidth) * 100;
            const y = (e.clientY / window.innerHeight) * 100;
            glow.style.setProperty('--x', x + '%');
            glow.style.setProperty('--y', y + '%');
        });
    </script>
</body>
</html>
